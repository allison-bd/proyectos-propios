<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Node.js y Express</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            crema: '#FBF5E9',
            'verde-node': '#339933',
            'verde-oscuro': '#33402A',
            amarillo: '#FCE7A8',
            'amarillo-texto': '#7A5B00',
            'cafe-oscuro': '#2B231B',
            'crema-codigo': '#EAD9B8',
            'verde-suave': '#A6C58C',
            ambar: '#E6B980',
          },
          fontFamily: {
            titulo: ['Fredoka', 'sans-serif'],
            lectura: ['Nunito', 'sans-serif'],
            codigo: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-crema font-lectura text-verde-oscuro min-h-screen">

  <!-- Vista 1: Menú de navegación -->
  <div id="vista-menu" class="min-h-screen flex flex-col items-center px-4 pt-8 pb-12">
    <div class="max-w-4xl w-full">
      <!-- Logo y título -->
      <div class="text-center mb-10">
        <div class="w-14 h-14 bg-verde-node rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 1.85c-.27 0-.55.07-.78.2l-7.44 4.3c-.48.28-.78.8-.78 1.36v8.58c0 .56.3 1.08.78 1.36l1.95 1.12c.95.46 1.27.46 1.71.46 1.4 0 2.21-.85 2.21-2.33V8.44c0-.12-.1-.22-.22-.22H8.5c-.13 0-.23.1-.23.22v8.47c0 .66-.68 1.31-1.77.76L4.45 16.5a.26.26 0 0 1-.12-.21V7.71c0-.09.04-.17.12-.21l7.44-4.3c.09-.04.2-.04.28 0l7.44 4.3c.08.04.12.12.12.21v8.58c0 .08-.04.17-.12.21l-7.44 4.3c-.08.04-.18.04-.27 0l-1.88-1.12c-.07-.04-.17-.05-.25-.01-.68.31-.81.35-1.46.53-.16.04-.4.12.09.35l2.45 1.45c.24.14.51.21.78.21.27 0 .54-.07.78-.2l7.44-4.3c.48-.28.78-.8.78-1.36V7.71c0-.56-.3-1.08-.78-1.36l-7.44-4.3c-.23-.13-.5-.2-.78-.2z"/>
          </svg>
        </div>
        <h1 class="font-titulo font-bold text-2xl text-verde-oscuro">Guía de estudio</h1>
        <p class="text-sm text-verde-oscuro/60 mt-1">Node.js & Express</p>
      </div>

      <!-- Fases grid -->
      <div id="nav-fases" class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- Vista 2: Pantalla de estudio -->
  <div id="vista-estudio" class="h-screen flex flex-col hidden">
    <!-- Header: barra de navegación + título -->
    <div id="header-fase" class="shrink-0 bg-crema border-b border-verde-oscuro/10">
      <!-- Rendered by app.js -->
    </div>

    <!-- Contenido scrolleable -->
    <div id="contenedor-tarjetas" class="flex-1 overflow-y-auto">
      <!-- Rendered by app.js -->
    </div>
  </div>

  <!-- App scripts (ESM) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
