<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Node.js y Express</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            crema: '#EFE8D6',
            'verde-node': '#339933',
            'verde-oscuro': '#33402A',
            amarillo: '#FCE7A8',
            'amarillo-texto': '#7A5B00',
            'cafe-oscuro': '#2B231B',
            'crema-codigo': '#EAD9B8',
            'verde-suave': '#A6C58C',
            ambar: '#E6B980',
          },
          fontFamily: {
            titulo: ['Fredoka', 'sans-serif'],
            lectura: ['Nunito', 'sans-serif'],
            codigo: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-crema font-lectura text-verde-oscuro min-h-screen overflow-x-hidden">

  <!-- Vista 1: Menú de navegación -->
  <div class="fixed -top-[10%] -left-[8%] w-[420px] h-[420px] rounded-full bg-[#7ED17E] blur-[90px] opacity-[0.45] pointer-events-none"></div>
  <div class="fixed -bottom-[12%] -right-[8%] w-[460px] h-[460px] rounded-full bg-[#FCE7A8] blur-[95px] opacity-[0.55] pointer-events-none"></div>
  <div class="fixed top-[35%] right-[5%] w-[320px] h-[320px] rounded-full bg-[#B8DDF0] blur-[80px] opacity-[0.4] pointer-events-none"></div>
  <div id="vista-menu" class="min-h-screen flex flex-col items-center px-4 pt-4 pb-12">
    <div class="max-w-4xl w-full">
      <!-- Logo y título -->
      <span class="cadena-item hidden" style="color:#33402A;opacity:.5;">→</span><div class="cadena-item hidden" style="background:rgba(230,185,128,.4);backdrop-filter:blur(8px);border:1px solid rgba(230,185,128,.55);color:#7A5B00;padding:0.4rem 1rem;border-radius:0.5rem;font-weight:700;font-size:0.9rem;">B (la necesita A)</div><span class="cadena-item hidden" style="color:#33402A;opacity:.5;">→</span><div class="cadena-item hidden" style="background:rgba(230,185,128,.4);backdrop-filter:blur(8px);border:1px solid rgba(230,185,128,.55);color:#7A5B00;padding:0.4rem 1rem;border-radius:0.5rem;font-weight:700;font-size:0.9rem;">C (la necesita B)</div>
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-[20px] bg-white/50 backdrop-blur-[14px] border border-white/70 shadow-[0_10px_26px_-12px_rgba(51,64,42,0.22)] flex items-center justify-center mx-auto mb-2">
          <svg width="28" height="28" viewBox="0 0 28 28">
            <path d="M14 4l10 5.5v9L14 24 4 18.5v-9z" fill="none" stroke="rgba(51,153,51,.75)" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="font-titulo font-bold text-2xl text-verde-oscuro">Guía de estudio</h1>
        <p class="text-sm text-verde-oscuro/60 mt-1">Node.js & Express</p>
      </div>

      <!-- Fases grid -->
      <div id="nav-fases" class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- Vista 2: Pantalla de estudio -->
  <div id="vista-estudio" class="h-screen flex flex-col hidden">
    <!-- Header: barra de navegación + título -->
    <div id="header-fase" class="shrink-0 bg-crema border-b border-verde-oscuro/10">
      <!-- Rendered by app.js -->
    </div>

    <!-- Contenido scrolleable -->
    <div id="contenedor-tarjetas" class="flex-1 overflow-y-auto">
      <!-- Rendered by app.js -->
    </div>
  </div>

  <!-- App scripts (ESM) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
